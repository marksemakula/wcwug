    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "alternateName": "WINRISE",

        "@type": "PostalAddress",
        "addressCountry": "UG"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+256-772-360-111",
        "contactType": "customer service",
        "areaServed": "UG",
        "availableLanguage": "English"
      },
      "sameAs": []
    }

    <!-- WebSite Schema with SitelinksSearchBox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Winrise Counselling & Wellness",
      "alternateName": "WINRISE",
      "url": "https://winrise.org",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://winrise.org/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- SiteNavigationElement Schema for Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SiteNavigationElement",
          "name": "Home",
          "url": "https://winrise.org/"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "Services",
          "description": "Professional counselling and wellness services including individual therapy, couples counselling, and corporate wellness programs",
          "url": "https://winrise.org/services"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "About Us",
          "description": "Learn about Winrise Counselling & Wellness, our mission, values, and team of professional counsellors",
          "url": "https://winrise.org/about"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "Resources",
          "description": "Mental health resources, articles, and educational content for wellness and personal growth",
          "url": "https://winrise.org/resources"
        },
        {
          "@type": "SiteNavigationElement",
          "name": "Contact",

        }
      ]
